<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0b0910">
<title>Alex Arcade</title>
<link rel="icon" href="../arcade/assets/coin.jpg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Silkscreen:wght@400;700&family=Noto+Sans+SC:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0b0910;
    --bg2: #13101a;
    --line: rgba(255,255,255,.08);
    --text: #f3ece0;
    --sub: #a79f93;
    --gold: #f0c14b;
    --accent: #f0c14b;
    --sw: min(480px, calc((100vh - 230px) * .75), calc(100vw - 40px));
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { background: var(--bg); color: var(--text); }
  body {
    font-family: "Noto Sans SC", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    min-height: 100vh; min-height: 100dvh;
    -webkit-tap-highlight-color: transparent;
  }
  body::before {
    content: ""; position: fixed; inset: 0; z-index: -1; pointer-events: none;
    background:
      radial-gradient(60vw 50vh at 30% 20%, color-mix(in srgb, var(--accent) 16%, transparent), transparent 70%),
      radial-gradient(50vw 50vh at 90% 90%, rgba(120, 80, 255, .08), transparent 70%);
    transition: background .4s;
  }
  button { font-family: inherit; color: inherit; }
  a { color: inherit; }

  /* ---------- top bar ---------- */
  .top {
    position: sticky; top: 0; z-index: 20;
    display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 12px;
    padding: 10px 18px; padding-top: max(10px, env(safe-area-inset-top));
    background: rgba(11, 9, 16, .82); backdrop-filter: blur(14px);
    border-bottom: 1px solid var(--line);
  }
  .back {
    justify-self: start; display: inline-flex; align-items: center; gap: 8px;
    text-decoration: none; font-family: "Bebas Neue", Impact, sans-serif; font-size: 20px; letter-spacing: .12em;
    color: var(--gold);
  }
  .back img { width: 24px; height: 24px; border-radius: 50%; }
  .now {
    display: flex; align-items: center; gap: 8px; min-width: 0;
    font-weight: 700; font-size: 15px; white-space: nowrap;
  }
  .now small { color: var(--sub); font-weight: 500; font-family: "Silkscreen", monospace; font-size: 11px; letter-spacing: .04em; }
  .tools { justify-self: end; display: flex; gap: 6px; }
  .iconbtn {
    height: 34px; min-width: 34px; padding: 0 12px; border-radius: 17px;
    display: inline-flex; align-items: center; justify-content: center; gap: 6px;
    background: rgba(255,255,255,.05); border: 1px solid var(--line);
    font-size: 13px; font-weight: 700; cursor: pointer; transition: .15s;
  }
  .iconbtn:hover { border-color: var(--accent); color: var(--accent); }
  .iconbtn.primary { background: var(--accent); color: #120c06; border-color: transparent; }
  .iconbtn.primary:hover { filter: brightness(1.08); color: #120c06; }
  .iconbtn svg { width: 16px; height: 16px; }

  /* ---------- stage ---------- */
  .stage {
    display: grid; grid-template-columns: auto minmax(280px, 380px); gap: 40px;
    justify-content: center; align-items: start;
    padding: 24px 20px 40px;
  }
  .device {
    width: calc(var(--sw) + 36px);
    border-radius: 30px; padding: 16px 18px 20px;
    background: linear-gradient(165deg, #2b2533 0%, #17131d 60%, #110e15 100%);
    box-shadow:
      0 30px 60px rgba(0,0,0,.6),
      0 0 0 1px rgba(255,255,255,.07),
      inset 0 1px 0 rgba(255,255,255,.12),
      0 0 80px color-mix(in srgb, var(--accent) 12%, transparent);
    user-select: none; -webkit-user-select: none;
  }
  .device-top {
    display: flex; justify-content: space-between; align-items: center;
    font-family: "Silkscreen", monospace; font-size: 10px; letter-spacing: .08em; color: #8d8496;
    padding: 0 6px 10px;
  }
  .led { display: inline-block; width: 6px; height: 6px; border-radius: 50%; background: #3a3; box-shadow: 0 0 6px #5f5; margin-right: 6px; vertical-align: 1px; }
  .led.off { background: #733; box-shadow: none; }
  .screen {
    position: relative; width: var(--sw); aspect-ratio: 3 / 4;
    border-radius: 10px; overflow: hidden; background: #000;
    box-shadow: 0 0 0 3px #07060a, 0 0 0 4px rgba(255,255,255,.06), inset 0 0 30px rgba(0,0,0,.8);
  }
  #screen { width: 100%; height: 100%; display: block; image-rendering: pixelated; touch-action: none; cursor: pointer; }
  .screen::after {
    content: ""; position: absolute; inset: 0; pointer-events: none;
    background: linear-gradient(160deg, rgba(255,255,255,.06), transparent 30%),
                repeating-linear-gradient(to bottom, rgba(0,0,0,.08) 0 1px, transparent 1px 3px);
    mix-blend-mode: screen;
  }
  .pad { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-top: 18px; }
  .key {
    display: flex; flex-direction: column; align-items: center; gap: 6px;
    background: none; border: 0; cursor: pointer; touch-action: none;
  }
  .cap {
    width: 62px; height: 62px; border-radius: 50%;
    display: grid; place-items: center;
    font-family: "Silkscreen", monospace; font-weight: 700; font-size: 15px; color: #e9e3ef;
    background: radial-gradient(circle at 35% 28%, #4a4352, #28222e 60%, #1a161f);
    box-shadow: 0 5px 0 #0a080d, 0 8px 14px rgba(0,0,0,.5), inset 0 1px 0 rgba(255,255,255,.18);
    transition: transform .05s, box-shadow .05s;
  }
  .key.ok .cap {
    background: radial-gradient(circle at 35% 28%, color-mix(in srgb, var(--accent) 60%, #fff), var(--accent) 55%, color-mix(in srgb, var(--accent) 50%, #000));
    color: #140d08;
  }
  .key.on .cap { transform: translateY(4px); box-shadow: 0 1px 0 #0a080d, 0 2px 6px rgba(0,0,0,.5), inset 0 1px 0 rgba(255,255,255,.1); }
  .key .lbl { font-size: 12px; color: var(--sub); text-align: center; line-height: 1.3; min-height: 2.6em; max-width: 110px; }
  .key .lbl b { color: var(--text); font-weight: 700; display: block; font-size: 12px; }

  /* ---------- side ---------- */
  .side { display: flex; flex-direction: column; gap: 14px; padding-top: 4px; }
  .card { background: rgba(255,255,255,.035); border: 1px solid var(--line); border-radius: 16px; padding: 18px; }
  .hd { display: flex; gap: 14px; align-items: center; }
  .hd .ico { width: 52px; height: 52px; border-radius: 14px; display: grid; place-items: center; font-size: 28px;
    background: color-mix(in srgb, var(--accent) 18%, transparent); border: 1px solid color-mix(in srgb, var(--accent) 45%, transparent); }
  .hd h1 { font-size: 22px; font-weight: 900; line-height: 1.15; }
  .hd .en { font-family: "Silkscreen", monospace; font-size: 11px; color: var(--accent); letter-spacing: .06em; }
  .chips { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 12px; }
  .chip { font-size: 11px; font-weight: 700; padding: 3px 9px; border-radius: 99px; background: rgba(255,255,255,.06); color: var(--sub); }
  .chip.hot { background: var(--accent); color: #120c06; }
  .desc { color: #cfc6b8; font-size: 14px; line-height: 1.75; margin-top: 12px; }
  .scores { display: grid; grid-template-columns: repeat(3, 1fr); margin-top: 14px; border-top: 1px solid var(--line); padding-top: 12px; }
  .scores div { text-align: center; }
  .scores b { display: block; font-family: "Bebas Neue", Impact, sans-serif; font-size: 26px; letter-spacing: .04em; line-height: 1; }
  .scores span { font-size: 11px; color: var(--sub); }
  .card h3 { font-size: 13px; font-weight: 900; letter-spacing: .08em; color: var(--sub); margin-bottom: 10px; display: flex; justify-content: space-between; }
  .ctl { display: grid; grid-template-columns: 58px 1fr auto; gap: 8px 10px; align-items: center; font-size: 13px; }
  .ctl .k { font-family: "Silkscreen", monospace; font-size: 11px; font-weight: 700; text-align: center; padding: 4px 0; border-radius: 6px; background: #2a2430; }
  .ctl .k.ok { background: var(--accent); color: #140d08; }
  .ctl kbd { font-family: "Silkscreen", monospace; font-size: 10px; color: var(--sub); border: 1px solid var(--line); border-radius: 4px; padding: 2px 5px; white-space: nowrap; }
  .ms { list-style: none; display: flex; flex-direction: column; gap: 8px; }
  .ms li { display: flex; gap: 10px; align-items: center; font-size: 13px; color: var(--sub); }
  .ms li.done { color: var(--text); }
  .ms .st { width: 18px; height: 18px; flex-shrink: 0; }
  .ms li.done .st { color: #ffd23f; filter: drop-shadow(0 0 6px rgba(255,210,63,.5)); }
  .ms li.flash { animation: pop .6s ease; }
  @keyframes pop { 30% { transform: scale(1.06); color: #ffd23f; } }
  .top5 { list-style: none; counter-reset: r; display: flex; flex-direction: column; gap: 4px; }
  .top5 li { counter-increment: r; display: flex; justify-content: space-between; font-size: 13px; padding: 4px 0; border-bottom: 1px dashed var(--line); }
  .top5 li::before { content: counter(r); width: 20px; color: var(--sub); font-family: "Silkscreen", monospace; }
  .top5 li span:first-child { flex: 1; font-family: "Bebas Neue", Impact, sans-serif; font-size: 18px; letter-spacing: .04em; }
  .top5 li span:last-child { color: var(--sub); font-size: 11px; }
  .top5 .empty { color: var(--sub); font-size: 12px; }
  .top5 .empty::before { content: none; }
  .tips { list-style: none; display: flex; flex-direction: column; gap: 6px; font-size: 13px; color: #cfc6b8; line-height: 1.6; }
  .tips li::before { content: "› "; color: var(--accent); font-weight: 900; }
  .row { display: flex; gap: 8px; }
  .row .iconbtn { flex: 1; height: 40px; border-radius: 12px; }

  /* ---------- switcher ---------- */
  .sheet {
    position: fixed; inset: 0; z-index: 50; display: none;
    background: rgba(5,4,8,.72); backdrop-filter: blur(10px);
  }
  .sheet.open { display: block; animation: fade .18s ease; }
  @keyframes fade { from { opacity: 0; } }
  .sheet-in {
    position: absolute; left: 50%; top: 6vh; transform: translateX(-50%);
    width: min(960px, calc(100vw - 24px)); max-height: 88vh; overflow: auto;
    background: var(--bg2); border: 1px solid var(--line); border-radius: 20px; padding: 18px;
  }
  .sheet-hd { display: flex; gap: 10px; align-items: center; margin-bottom: 12px; flex-wrap: wrap; }
  .sheet-hd input {
    flex: 1; min-width: 160px; height: 38px; border-radius: 10px; border: 1px solid var(--line);
    background: rgba(0,0,0,.35); color: var(--text); padding: 0 12px; font-size: 14px; outline: none;
  }
  .sheet-hd input:focus { border-color: var(--accent); }
  .cats { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 14px; }
  .cats button { border: 1px solid var(--line); background: none; padding: 5px 12px; border-radius: 99px; font-size: 12px; font-weight: 700; color: var(--sub); cursor: pointer; }
  .cats button.on { background: var(--gold); border-color: var(--gold); color: #120c06; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 10px; }
  .tile {
    display: flex; flex-direction: column; text-align: left; gap: 6px; cursor: pointer;
    border: 1px solid var(--line); border-radius: 14px; padding: 8px; background: rgba(255,255,255,.03); transition: .15s;
  }
  .tile:hover, .tile.cur { border-color: var(--c); transform: translateY(-2px); }
  .tile .th { aspect-ratio: 3/4; border-radius: 8px; background: #000 center/cover no-repeat; image-rendering: pixelated; position: relative; }
  .tile .th i { position: absolute; left: 6px; top: 6px; font-style: normal; font-size: 10px; font-weight: 900; padding: 2px 6px; border-radius: 99px; background: var(--c); color: #120c06; }
  .tile b { font-size: 13px; }
  .tile small { font-size: 11px; color: var(--sub); display: flex; justify-content: space-between; }

  .toast {
    position: fixed; left: 50%; bottom: 24px; transform: translate(-50%, 20px); opacity: 0; z-index: 60;
    background: #1e1a24; border: 1px solid var(--accent); padding: 10px 16px; border-radius: 12px; font-size: 13px; font-weight: 700;
    transition: .25s; pointer-events: none;
  }
  .toast.show { opacity: 1; transform: translate(-50%, 0); }

  /* 全屏：只留设备 */
  body.fs .top, body.fs .side { display: none; }
  body.fs .stage { padding: 12px; min-height: 100vh; align-items: center; grid-template-columns: auto; }
  body.fs { --sw: min(720px, calc((100vh - 170px) * .75), calc(100vw - 40px)); }

  @media (max-width: 980px) {
    .stage { grid-template-columns: 1fr; justify-items: center; gap: 20px; padding-top: 16px; }
    .side { width: 100%; max-width: 560px; }
    .now small { display: none; }
  }
  @media (max-width: 640px) {
    :root { --sw: min(calc(100vw - 28px), calc((100dvh - 250px) * .75)); }
    .top { padding: 8px 10px; grid-template-columns: auto 1fr auto; }
    .back span { display: none; }
    .now { justify-content: center; font-size: 14px; }
    .tools .hide-s { display: none; }
    .stage { padding: 10px 8px 30px; }
    .device { width: calc(var(--sw) + 16px); padding: 8px 8px 14px; border-radius: 22px; }
    .device-top { display: none; }
    .pad { gap: 6px; margin-top: 14px; }
    .cap { width: 72px; height: 72px; font-size: 16px; }
    .key .lbl { font-size: 11px; }
  }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
</style>
</head>
<body>

<header class="top">
  <a class="back" href="../arcade/"><img src="../arcade/assets/coin.jpg" alt=""><span>ALEX ARCADE</span></a>
  <div class="now"><span id="nIcon"></span><span id="nTitle">…</span><small id="nEn"></small></div>
  <div class="tools">
    <button class="iconbtn primary" id="bSwitch" type="button" title="换游戏 (G)">
      <svg viewBox="0 0 16 16" fill="currentColor"><rect x="1" y="1" width="6" height="6" rx="1.5"/><rect x="9" y="1" width="6" height="6" rx="1.5"/><rect x="1" y="9" width="6" height="6" rx="1.5"/><rect x="9" y="9" width="6" height="6" rx="1.5"/></svg>
      <span>换游戏</span>
    </button>
    <button class="iconbtn" id="bMute" type="button" title="声音 (M)"></button>
    <button class="iconbtn hide-s" id="bFs" type="button" title="专注模式 (F)">
      <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M1 5V1h4M11 1h4v4M15 11v4h-4M5 15H1v-4"/></svg>
    </button>
  </div>
</header>

<main class="stage">
  <section class="device" aria-label="AI Passport 掌机">
    <div class="device-top"><span><i class="led" id="led"></i>AI PASSPORT</span><span id="devName">240×320</span></div>
    <div class="screen"><canvas id="screen" width="480" height="640" aria-label="游戏画面"></canvas></div>
    <div class="pad">
      <button class="key" data-k="up" type="button"><span class="cap">UP</span><span class="lbl" id="lUp"></span></button>
      <button class="key" data-k="down" type="button"><span class="cap">DN</span><span class="lbl" id="lDown"></span></button>
      <button class="key ok" data-k="ok" type="button"><span class="cap">OK</span><span class="lbl" id="lOk"></span></button>
    </div>
  </section>

  <aside class="side">
    <div class="card">
      <div class="hd">
        <div class="ico" id="gIcon"></div>
        <div><h1 id="gTitle"></h1><div class="en" id="gEn"></div></div>
      </div>
      <div class="chips" id="gChips"></div>
      <p class="desc" id="gDesc"></p>
      <div class="scores">
        <div><b id="sNow">0</b><span>本局</span></div>
        <div><b id="sBest">0</b><span>最佳</span></div>
        <div><b id="sStars">0/3</b><span>星星</span></div>
      </div>
    </div>
    <div class="card">
      <h3><span>操作</span><span style="font-weight:500">P 暂停 · R 重开</span></h3>
      <div class="ctl" id="gCtl"></div>
    </div>
    <div class="card" id="cMs">
      <h3><span>任务</span><span id="msCount"></span></h3>
      <ul class="ms" id="gMs"></ul>
    </div>
    <div class="card" id="cTop">
      <h3><span>本机排行</span><span id="plays"></span></h3>
      <ol class="top5" id="gTop"></ol>
    </div>
    <div class="card" id="cTips">
      <h3><span>小技巧</span></h3>
      <ul class="tips" id="gTips"></ul>
    </div>
    <div class="row">
      <button class="iconbtn" id="bRestart" type="button">重新开始</button>
      <button class="iconbtn" id="bPause" type="button">暂停</button>
      <button class="iconbtn" id="bShare" type="button">复制链接</button>
    </div>
  </aside>
</main>

<div class="sheet" id="sheet" aria-hidden="true">
  <div class="sheet-in" role="dialog" aria-label="选择游戏">
    <div class="sheet-hd">
      <input id="q" type="search" placeholder="搜索游戏名、类型…" autocomplete="off">
      <button class="iconbtn" id="bClose" type="button">关闭</button>
    </div>
    <div class="cats" id="cats"></div>
    <div class="grid" id="grid"></div>
  </div>
</div>
<div class="toast" id="toast"></div>

<script src="catalog.js"></script>
<script src="arcade-kit.js"></script>

<script>
(function () {
  'use strict';
  const A = window.Arcade, Save = A.Save;
  const $ = (id) => document.getElementById(id);
  const CAT = Object.fromEntries(window.CATEGORIES.map((c) => [c.id, c.label]));
  const list = window.CATALOG.filter((c) => A.games[c.id]);
  const STAR = '<svg class="st" viewBox="0 0 20 20"><path fill="currentColor" d="M10 1.5l2.6 5.5 6 .8-4.4 4.1 1.1 6-5.3-2.9-5.3 2.9 1.1-6L1.4 7.8l6-.8z"/></svg>';
  const STAR_O = '<svg class="st" viewBox="0 0 20 20"><path fill="none" stroke="currentColor" stroke-width="1.4" d="M10 1.5l2.6 5.5 6 .8-4.4 4.1 1.1 6-5.3-2.9-5.3 2.9 1.1-6L1.4 7.8l6-.8z"/></svg>';
  const cover = (id) => '../arcade/assets/shots/' + id + '.png';

  const run = A.mount($('screen'), {
    onLoad: paint,
    onScore: (s) => { $('sNow').textContent = A.U.fmt(s); },
    onState: (st) => {
      $('led').classList.toggle('off', st === 'pause');
      $('bPause').textContent = st === 'pause' ? '继续' : '暂停';
      if (st === 'title') $('sNow').textContent = '0';
    },
    onMission: (i, fresh) => { if (fresh) { paintMissions(i); } },
    onEnd: (r) => {
      $('sNow').textContent = A.U.fmt(r.score);
      paintScores(); paintTop(); paintMissions();
    }
  });

  window.__run = run;
  function cur() { return run.R.def; }
  function esc(s) { return String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c])); }

  function paint(d) {
    document.documentElement.style.setProperty('--accent', d.color || '#f0c14b');
    document.title = d.title + ' · Alex Arcade';
    $('nIcon').textContent = d.icon; $('nTitle').textContent = d.title; $('nEn').textContent = d.en || '';
    $('gIcon').textContent = d.icon; $('gTitle').textContent = d.title; $('gEn').textContent = (d.en || '').toUpperCase();
    $('devName').textContent = (d.en || '').toUpperCase();
    $('gDesc').textContent = d.desc || d.pitch || '';
    $('gChips').innerHTML = [CAT[d.cat] || '', d.remade ? '2026 重制' : '', d.time ? d.time + ' 秒一轮' : '']
      .filter(Boolean).map((t, i) => '<span class="chip' + (i === 1 && d.remade ? ' hot' : '') + '">' + esc(t) + '</span>').join('');
    const c = d.controls || {};
    const lab = (s) => { const p = String(s || '').split(/[·/]/); return '<b>' + esc(p[0].trim()) + '</b>' + esc((p[1] || '').trim()); };
    $('lUp').innerHTML = lab(c.up); $('lDown').innerHTML = lab(c.down); $('lOk').innerHTML = lab(c.ok);
    $('gCtl').innerHTML =
      '<span class="k">UP</span><span>' + esc(c.up || '—') + '</span><kbd>← ↑ A</kbd>' +
      '<span class="k">DOWN</span><span>' + esc(c.down || '—') + '</span><kbd>→ ↓ D</kbd>' +
      '<span class="k ok">OK</span><span>' + esc(c.ok || '—') + '</span><kbd>Space ↵</kbd>';
    $('cTips').style.display = d.tips && d.tips.length ? '' : 'none';
    $('gTips').innerHTML = (d.tips || []).map((t) => '<li>' + esc(t) + '</li>').join('');
    $('cMs').style.display = d.missions.length ? '' : 'none';
    $('cTop').style.display = d.noScore ? 'none' : '';
    $('sNow').textContent = '0';
    paintScores(); paintMissions(); paintTop(); paintGrid();
    try { history.replaceState(null, '', '?id=' + encodeURIComponent(d.id)); } catch (e) { /* file:// */ }
  }
  function paintScores() {
    const d = cur();
    $('sBest').textContent = A.U.fmt(Save.best(d.id));
    $('sStars').textContent = Save.stars(d.id) + '/' + d.missions.length;
  }
  function paintMissions(flashI) {
    const d = cur();
    $('msCount').textContent = Save.stars(d.id) + ' / ' + d.missions.length + ' ★';
    $('gMs').innerHTML = d.missions.map((m, i) => {
      const done = Save.hasMission(d.id, i);
      return '<li class="' + (done ? 'done' : '') + (i === flashI ? ' flash' : '') + '">' + (done ? STAR : STAR_O) + esc(m.text) + '</li>';
    }).join('');
    paintScores();
  }
  function paintTop() {
    const d = cur(), t = Save.top(d.id);
    $('plays').textContent = '已玩 ' + Save.plays(d.id) + ' 局';
    $('gTop').innerHTML = t.length
      ? t.map((e) => { const dt = new Date(e.d); return '<li><span>' + A.U.fmt(e.s) + '</span><span>' + (dt.getMonth() + 1) + '/' + dt.getDate() + '</span></li>'; }).join('')
      : '<li class="empty">还没有记录，打一局试试。</li>';
  }

  // ---------- 换游戏面板
  let cat = 'all', q = '';
  function paintGrid() {
    const d = cur();
    $('cats').innerHTML = window.CATEGORIES.map((c) => {
      const n = c.id === 'all' ? list.length : list.filter((x) => x.cat === c.id).length;
      return n ? '<button type="button" data-c="' + c.id + '" class="' + (c.id === cat ? 'on' : '') + '">' + c.label + ' ' + n + '</button>' : '';
    }).join('');
    const k = q.trim().toLowerCase();
    $('grid').innerHTML = list.filter((g) => (cat === 'all' || g.cat === cat) &&
      (!k || (g.title + g.en + g.pitch + (CAT[g.cat] || '')).toLowerCase().includes(k)))
      .map((g) => '<button type="button" class="tile' + (d && g.id === d.id ? ' cur' : '') + '" data-id="' + g.id + '" style="--c:' + g.color + '">' +
        '<span class="th" style="background-image:url(' + cover(g.id) + ')">' + (g.remade ? '<i>重制</i>' : '') + '</span>' +
        '<b>' + g.icon + ' ' + esc(g.title) + '</b>' +
        '<small><span>' + (CAT[g.cat] || '') + '</span><span>' + (g.missions.length ? Save.stars(g.id) + '/' + g.missions.length + '★' : '') + '</span></small></button>').join('') ||
      '<p style="color:var(--sub);padding:20px">没有找到，换个词试试。</p>';
  }
  function openSheet(v) {
    $('sheet').classList.toggle('open', v);
    $('sheet').setAttribute('aria-hidden', v ? 'false' : 'true');
    if (v) { run.pause(true); paintGrid(); setTimeout(() => $('q').focus(), 30); }
  }
  $('bSwitch').onclick = () => openSheet(true);
  $('bClose').onclick = () => openSheet(false);
  $('sheet').addEventListener('click', (e) => { if (e.target === $('sheet')) openSheet(false); });
  $('cats').addEventListener('click', (e) => { const b = e.target.closest('button'); if (b) { cat = b.dataset.c; paintGrid(); } });
  $('q').addEventListener('input', (e) => { q = e.target.value; paintGrid(); });
  $('grid').addEventListener('click', (e) => {
    const b = e.target.closest('.tile'); if (!b) return;
    openSheet(false); run.load(b.dataset.id);
  });

  // ---------- 按键
  document.querySelectorAll('.key').forEach((el) => {
    const k = el.dataset.k;
    const on = (e) => { e.preventDefault(); el.classList.add('on'); run.press(k, true); if (navigator.vibrate) navigator.vibrate(8); };
    const off = (e) => { e.preventDefault(); el.classList.remove('on'); run.press(k, false); };
    el.addEventListener('pointerdown', on);
    el.addEventListener('pointerup', off);
    el.addEventListener('pointercancel', off);
    el.addEventListener('pointerleave', (e) => { if (el.classList.contains('on')) off(e); });
    el.addEventListener('contextmenu', (e) => e.preventDefault());
  });
  const cv = $('screen');
  cv.addEventListener('pointerdown', (e) => { e.preventDefault(); run.press('ok', true); keyVis('ok', true); });
  const cvUp = () => { run.press('ok', false); keyVis('ok', false); };
  cv.addEventListener('pointerup', cvUp); cv.addEventListener('pointercancel', cvUp); cv.addEventListener('pointerleave', cvUp);
  cv.addEventListener('contextmenu', (e) => e.preventDefault());

  const MAP = { ArrowLeft: 'up', ArrowUp: 'up', KeyA: 'up', KeyW: 'up', ArrowRight: 'down', ArrowDown: 'down', KeyD: 'down', KeyS: 'down',
    Space: 'ok', Enter: 'ok', NumpadEnter: 'ok', KeyJ: 'ok', KeyZ: 'ok', KeyK: 'ok' };
  function keyVis(k, v) { const el = document.querySelector('.key[data-k="' + k + '"]'); if (el) el.classList.toggle('on', v); }
  window.addEventListener('keydown', (e) => {
    if ($('sheet').classList.contains('open')) {
      if (e.code === 'Escape') openSheet(false);
      return;
    }
    if (e.target && e.target.tagName === 'INPUT') return;
    const k = MAP[e.code];
    if (k) { e.preventDefault(); if (!e.repeat) { run.press(k, true); keyVis(k, true); } return; }
    if (e.code === 'KeyP') run.pause();
    else if (e.code === 'Escape') { if (run.state === 'pause' || run.state === 'over') run.toTitle(); else run.pause(true); }
    else if (e.code === 'KeyR') run.restart();
    else if (e.code === 'KeyM') toggleMute();
    else if (e.code === 'KeyF') toggleFs();
    else if (e.code === 'KeyG') openSheet(true);
  });
  window.addEventListener('keyup', (e) => { const k = MAP[e.code]; if (k) { run.press(k, false); keyVis(k, false); } });
  window.addEventListener('blur', () => { ['up', 'down', 'ok'].forEach((k) => { run.press(k, false); keyVis(k, false); }); });

  function toggleMute() { run.setMuted(!run.isMuted()); paintMute(); }
  function paintMute() {
    $('bMute').innerHTML = run.isMuted()
      ? '<svg viewBox="0 0 16 16" fill="currentColor"><path d="M2 6h3l4-3v10L5 10H2z"/><path d="M11 6l4 4M15 6l-4 4" stroke="currentColor" stroke-width="1.6"/></svg>'
      : '<svg viewBox="0 0 16 16" fill="currentColor"><path d="M2 6h3l4-3v10L5 10H2z"/><path d="M11 5.5a3.5 3.5 0 010 5M12.8 3.5a6 6 0 010 9" fill="none" stroke="currentColor" stroke-width="1.5"/></svg>';
  }
  function toggleFs() { document.body.classList.toggle('fs'); setTimeout(run.resize, 50); }
  $('bMute').onclick = toggleMute;
  $('bFs').onclick = toggleFs;
  $('bRestart').onclick = () => run.restart();
  $('bPause').onclick = () => run.pause();
  $('bShare').onclick = () => {
    const url = location.href;
    const done = () => { $('toast').textContent = '链接已复制，发给朋友直接开玩'; $('toast').classList.add('show'); setTimeout(() => $('toast').classList.remove('show'), 1600); };
    if (navigator.clipboard) navigator.clipboard.writeText(url).then(done, () => prompt('复制链接：', url)); else prompt('复制链接：', url);
  };
  paintMute();

  // ---------- 启动
  const params = new URLSearchParams(location.search);
  let id = params.get('id') || params.get('game') || Save.last();
  const alias = { fishhunter: 'fishhunter', tank: 'battlecity', neonpop: 'match3', 'paws-sprint': 'pawssprint', racer: 'thunderracer' };
  if (alias[id]) id = alias[id];
  if (!A.games[id]) id = 'thunder';
  run.load(id);
  if (document.fonts && document.fonts.load) document.fonts.load('10px Silkscreen').catch(() => {});
})();
</script>
</body>
</html>
