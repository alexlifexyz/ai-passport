<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Alex Arcade · 柜机</title>
<link rel="icon" href="../arcade/assets/coin.jpg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg-main: #100a08;
    --cyan: #7dffb3;
    --pink: #ff3d7f;
    --gold: #f0c14b;
    --text-main: #f2e2c4;
    --text-sub: #c4b49a;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--bg-main);
    color: var(--text-main);
    font-family: "IBM Plex Sans", "PingFang SC", "Hiragino Sans GB", sans-serif;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
  }
  .space-bg {
    position: fixed; inset: 0; z-index: -1;
    background:
      radial-gradient(circle at 50% 12%, #2a1612 0%, #100a08 68%),
      url("../arcade/assets/hall.jpg") center / cover;
    opacity: .28;
    filter: saturate(.6);
  }
  header {
    background: rgba(12, 8, 7, 0.9);
    backdrop-filter: blur(12px);
    border-bottom: 1px solid rgba(240, 193, 75, 0.25);
    padding: 10px 20px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 12px;
  }
  .brand-back {
    display: flex; align-items: center; gap: 8px;
    color: var(--gold); text-decoration: none;
    font-family: "Bebas Neue", Impact, sans-serif;
    letter-spacing: 0.12em; font-size: 18px;
  }
  .brand-back img { width: 22px; height: 22px; border-radius: 50%; }
  .nav-right { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .btn-pill {
    background: rgba(255,255,255,0.06);
    border: 1px solid rgba(242,226,196,0.2);
    color: var(--text-main);
    padding: 6px 12px;
    border-radius: 20px;
    font-size: 12px;
    font-weight: 700;
    text-decoration: none;
    cursor: pointer;
  }
  .btn-pill:hover { border-color: var(--gold); color: var(--gold); }
  .btn-gold { background: var(--gold); color: #1a1008; border-color: var(--gold); }

  /* 整体两栏布局：左侧 Menu + 右侧主舞台 */
  .arcade-workspace {
    display: flex;
    flex: 1;
    min-height: calc(100vh - 54px);
    position: relative;
    overflow: hidden;
  }

  /* 左侧 Sidebar Menu */
  .game-sidebar {
    width: 290px;
    flex-shrink: 0;
    background: rgba(18, 11, 9, 0.96);
    border-right: 1px solid rgba(240, 193, 75, 0.18);
    display: flex;
    flex-direction: column;
    height: calc(100vh - 54px);
    position: sticky;
    top: 54px;
    z-index: 30;
    backdrop-filter: blur(16px);
  }
  .sidebar-header {
    padding: 12px 14px 10px;
    border-bottom: 1px solid rgba(255, 255, 255, 0.08);
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  .sidebar-title-box {
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .sidebar-title {
    font-family: "Bebas Neue", Impact, sans-serif;
    font-size: 19px;
    letter-spacing: 1.4px;
    color: var(--gold);
  }
  .sidebar-count {
    font-size: 11px;
    font-weight: 700;
    color: #100a08;
    background: var(--gold);
    padding: 2px 7px;
    border-radius: 10px;
  }
  .search-wrap {
    position: relative;
    width: 100%;
  }
  .sidebar-search {
    width: 100%;
    background: rgba(0, 0, 0, 0.45);
    border: 1px solid rgba(242, 226, 196, 0.18);
    color: var(--text-main);
    font-size: 12px;
    padding: 6px 10px;
    border-radius: 6px;
    outline: none;
    transition: border-color 0.2s;
  }
  .sidebar-search:focus {
    border-color: var(--gold);
    background: rgba(0, 0, 0, 0.65);
  }
  .sidebar-tabs {
    display: flex;
    gap: 4px;
    overflow-x: auto;
    scrollbar-width: none;
    padding-bottom: 2px;
  }
  .sidebar-tabs::-webkit-scrollbar { display: none; }
  .tab-btn {
    background: rgba(255, 255, 255, 0.06);
    border: 1px solid rgba(255, 255, 255, 0.1);
    color: var(--text-sub);
    font-size: 11px;
    padding: 3px 8px;
    border-radius: 12px;
    cursor: pointer;
    white-space: nowrap;
    transition: all 0.15s;
  }
  .tab-btn:hover { color: var(--gold); border-color: rgba(240, 193, 75, 0.4); }
  .tab-btn.active {
    background: var(--gold);
    color: #1a1008;
    border-color: var(--gold);
    font-weight: 800;
  }

  /* 侧边栏菜单列表 */
  .sidebar-list {
    flex: 1;
    overflow-y: auto;
    padding: 8px 8px 30px;
    scrollbar-width: thin;
    scrollbar-color: rgba(240, 193, 75, 0.3) transparent;
  }
  .sidebar-list::-webkit-scrollbar { width: 5px; }
  .sidebar-list::-webkit-scrollbar-thumb {
    background: rgba(240, 193, 75, 0.3);
    border-radius: 4px;
  }
  .sidebar-group-title {
    font-size: 10px;
    font-weight: 800;
    letter-spacing: 1.2px;
    color: #bfa892;
    padding: 12px 8px 5px;
    text-transform: uppercase;
  }
  .menu-item {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 8px 10px;
    margin-bottom: 3px;
    border-radius: 8px;
    text-decoration: none;
    color: var(--text-main);
    border: 1px solid transparent;
    background: rgba(255, 255, 255, 0.02);
    transition: all 0.15s ease;
    cursor: pointer;
    position: relative;
  }
  .menu-item:hover {
    background: rgba(255, 255, 255, 0.07);
    border-color: rgba(240, 193, 75, 0.25);
    transform: translateX(2px);
  }
  .menu-item.active {
    background: linear-gradient(90deg, rgba(240, 193, 75, 0.18) 0%, rgba(240, 193, 75, 0.04) 100%);
    border-color: var(--gold);
    box-shadow: 0 4px 14px rgba(0, 0, 0, 0.45);
  }
  .menu-item.active::before {
    content: "";
    position: absolute;
    left: 0;
    top: 6px;
    bottom: 6px;
    width: 3.5px;
    background: var(--gold);
    border-radius: 0 3px 3px 0;
    box-shadow: 0 0 8px var(--gold);
  }
  .menu-icon {
    font-size: 20px;
    width: 26px;
    text-align: center;
    flex-shrink: 0;
  }
  .menu-info {
    flex: 1;
    min-width: 0;
  }
  .menu-title-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 6px;
  }
  .menu-title {
    font-size: 13px;
    font-weight: 700;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    color: var(--text-main);
  }
  .menu-item.active .menu-title {
    color: var(--gold);
  }
  .menu-sub {
    font-size: 10px;
    color: var(--text-sub);
    display: block;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    margin-top: 2px;
    opacity: 0.85;
  }
  .menu-badge {
    font-size: 9px;
    font-weight: 800;
    padding: 1px 4px;
    border-radius: 3px;
    letter-spacing: 0.5px;
    flex-shrink: 0;
  }
  .menu-badge.new {
    background: #f59e0b;
    color: #100a08;
  }

  /* 右侧主舞台 */
  .arcade-main {
    flex: 1;
    min-width: 0;
    overflow-y: auto;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
  }
  .header-left {
    display: flex;
    align-items: center;
    gap: 12px;
  }
  .header-badge {
    font-size: 11px;
    color: var(--text-sub);
    border: 1px solid rgba(240, 193, 75, 0.25);
    padding: 2px 8px;
    border-radius: 10px;
    letter-spacing: 0.5px;
  }
  .btn-sidebar-toggle {
    display: none;
    background: rgba(255,255,255,0.08);
    border: 1px solid rgba(240,193,75,0.3);
    color: var(--gold);
    padding: 5px 10px;
    border-radius: 6px;
    font-size: 12px;
    font-weight: 700;
    cursor: pointer;
  }

  .game-layout {
    max-width: 1080px;
    width: 100%;
    margin: 20px auto;
    padding: 0 24px 28px;
    display: grid;
    grid-template-columns: 1.05fr .95fr;
    gap: 32px;
    align-items: center;
  }
  .game-details {
    background: rgba(26, 16, 14, 0.82);
    border: 1px solid #3a2a22;
    padding: 28px;
    box-shadow: 0 18px 40px rgba(0,0,0,.55);
  }
  .game-icon-large { font-size: 42px; margin-bottom: 8px; }
  .game-title-lg {
    font-family: "Bebas Neue", Impact, sans-serif;
    font-size: 40px; letter-spacing: .06em; line-height: .9;
    color: var(--gold); margin-bottom: 6px;
  }
  .game-sub-lg {
    font-size: 12px; font-weight: 700; color: var(--cyan);
    letter-spacing: .14em; margin-bottom: 14px;
  }
  .game-desc-lg {
    font-size: 14px; color: var(--text-sub); line-height: 1.7; margin-bottom: 16px;
  }
  .game-tags-lg { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 16px; }
  .tag-lg {
    border: 1px solid rgba(125,255,179,.35); color: var(--cyan);
    padding: 4px 10px; border-radius: 4px; font-size: 12px; font-weight: 700;
  }
  .score-row {
    display: flex; gap: 16px; margin-bottom: 16px;
    font-family: "Bebas Neue", Impact, sans-serif;
    letter-spacing: .12em; font-size: 18px;
  }
  .score-row span { color: var(--text-sub); font-size: 12px; letter-spacing: .16em; }
  .control-card {
    background: rgba(0,0,0,0.35);
    border: 1px dashed rgba(242,226,196,0.22);
    border-radius: 8px;
    padding: 14px;
    margin-bottom: 18px;
  }
  .control-card h4 {
    font-size: 12px; color: var(--gold); margin-bottom: 8px; letter-spacing: 0.5px;
  }
  .control-card p { font-size: 12px; color: var(--text-sub); line-height: 1.65; }
  .control-card strong { color: #fff; }
  .row-btns { display: flex; gap: 8px; flex-wrap: wrap; }

  .device-column { display: flex; flex-direction: column; align-items: center; }
  .device-shell {
    position: relative;
    width: 300px;
    background: linear-gradient(160deg, rgba(255,255,255,0.16), rgba(255,255,255,0.03));
    border: 2px solid rgba(255,255,255,0.28);
    border-radius: 22px;
    padding: 16px 14px 18px;
    box-shadow: 0 24px 60px rgba(0,0,0,0.85), inset 0 0 20px rgba(255,255,255,0.05);
    backdrop-filter: blur(16px);
    display: flex; flex-direction: column; align-items: center;
  }
  .device-brand {
    width: 100%;
    display: flex; justify-content: space-between; align-items: center;
    padding: 0 4px 8px;
    font-size: 11px; font-weight: 700; letter-spacing: 1.4px;
    color: var(--gold);
    border-bottom: 1px dashed rgba(240, 193, 75, 0.25);
    margin-bottom: 10px;
  }
  .screen-bezel {
    width: 256px; height: 336px;
    background: #050308;
    border-radius: 10px;
    padding: 8px;
    box-shadow: inset 0 0 14px rgba(0,0,0,0.95), 0 0 24px rgba(240, 193, 75, 0.12);
    border: 2px solid #2a2218;
  }
  #gameCanvas {
    width: 240px; height: 320px;
    background: #080a14;
    border-radius: 4px;
    display: block;
    image-rendering: pixelated;
  }
  .controls-panel {
    margin-top: 14px; width: 100%;
    display: flex; justify-content: space-around; align-items: center;
  }
  .hw-btn {
    display: flex; flex-direction: column; align-items: center; gap: 4px;
    cursor: pointer; user-select: none;
  }
  .btn-circle {
    width: 52px; height: 52px; border-radius: 50%;
    background: radial-gradient(circle at 30% 25%, #ff5a5a, #b11a1a 55%, #6a0d0d);
    border: 2px solid rgba(255,255,255,0.28);
    box-shadow: 0 6px 0 #3a0a0a, inset 0 2px 3px rgba(255,255,255,0.35);
    display: flex; align-items: center; justify-content: center;
    font-weight: 900; font-size: 14px; color: #fff;
  }
  .btn-circle.active, .btn-circle:active {
    transform: translateY(4px);
    box-shadow: 0 2px 0 #3a0a0a;
    filter: brightness(1.15);
  }
  #btn-ok .btn-circle {
    background: radial-gradient(circle at 30% 25%, #ffe08a, #f0c14b 55%, #8a5a10);
    color: #1a1008;
    box-shadow: 0 6px 0 #5a3a08, inset 0 2px 3px rgba(255,255,255,0.4);
  }
  #btn-ok .btn-circle.active, #btn-ok .btn-circle:active { box-shadow: 0 2px 0 #5a3a08; }
  .btn-label { font-size: 11px; font-weight: 700; color: var(--text-sub); }
  .key-hint { font-size: 9px; color: #8a7460; }
  kbd { background: #2a1c16; color: #fff; padding: 1px 4px; border-radius: 3px; font-size: 9px; border: 1px solid #5a4336; }
  .swap {
    margin-top: 12px; display: flex; gap: 8px;
  }

  footer {
    border-top: 1px solid rgba(255,255,255,0.08);
    padding: 16px 20px 24px;
    text-align: center;
    font-size: 12px;
    color: #8a7460;
  }
  footer a { color: var(--gold); }

  @media (max-width: 1024px) {
    .btn-sidebar-toggle { display: block; }
    .game-sidebar {
      position: fixed;
      left: 0;
      top: 54px;
      bottom: 0;
      height: calc(100vh - 54px);
      transform: translateX(-100%);
      transition: transform 0.25s cubic-bezier(0.4, 0, 0.2, 1);
      box-shadow: 6px 0 28px rgba(0,0,0,0.85);
    }
    .game-sidebar.open {
      transform: translateX(0);
    }
    .sidebar-mask {
      display: none;
      position: fixed;
      inset: 54px 0 0 0;
      background: rgba(0,0,0,0.65);
      z-index: 25;
      backdrop-filter: blur(4px);
    }
    .sidebar-mask.open { display: block; }
  }

  @media (max-width: 860px) {
    .header-badge { display: none; }
    .game-layout { grid-template-columns: 1fr; padding: 16px; }
    .game-details { order: 2; }
    .device-column { order: 1; }
  }
</style>
</head>
<body>
<div class="space-bg"></div>

<header>
  <div class="header-left">
    <button class="btn-sidebar-toggle" id="btn-toggle-sidebar" type="button">☰ 游戏列表</button>
    <a href="../arcade/" class="brand-back">
      <img src="../arcade/assets/coin.jpg" alt=""> ALEX ARCADE
    </a>
    <span class="header-badge">25 款游戏在席</span>
  </div>
  <div class="nav-right">
    <button class="btn-pill" id="btn-sound-toggle" type="button">音效开</button>
    <button class="btn-pill" id="btn-share-link" type="button">复制链接</button>
    <a href="../arcade/" class="btn-pill btn-gold">返回大厅</a>
  </div>
</header>

<div class="arcade-workspace">
  <!-- 左侧 游戏列表 Sidebar Menu -->
  <aside class="game-sidebar" id="game-sidebar">
    <div class="sidebar-header">
      <div class="sidebar-title-box">
        <span class="sidebar-title">GAME SELECTOR</span>
        <span class="sidebar-count" id="sidebar-count">25 款</span>
      </div>
      <div class="search-wrap">
        <input type="text" id="sidebar-search" class="sidebar-search" placeholder="🔍 快速搜索游戏..." />
      </div>
      <div class="sidebar-tabs" id="sidebar-tabs">
        <button type="button" class="tab-btn active" data-tab="all">全部</button>
        <button type="button" class="tab-btn" data-tab="new">✨ 新品 (9)</button>
        <button type="button" class="tab-btn" data-tab="chill">轻松治愈</button>
        <button type="button" class="tab-btn" data-tab="action">动作竞速</button>
        <button type="button" class="tab-btn" data-tab="shoot">街机射击</button>
      </div>
    </div>
    <div class="sidebar-list" id="sidebar-list"></div>
  </aside>

  <!-- 移动端侧边栏遮罩 -->
  <div class="sidebar-mask" id="sidebar-mask"></div>

  <!-- 右侧 主舞台 -->
  <main class="arcade-main">
    <div class="game-layout">
      <div class="game-details">
        <div class="game-icon-large" id="gIcon">🐾</div>
        <h1 class="game-title-lg" id="gTitle">短腿爪爪运动会</h1>
        <div class="game-sub-lg" id="gSub">PAWS SPRINT: WHOLESOME DASH</div>
        <p class="game-desc-lg" id="gDesc"></p>
        <div class="score-row">
          <div>NOW <span id="gNow">0</span></div>
          <div>BEST <span id="gBest">0</span></div>
        </div>
        <div class="game-tags-lg" id="gTags"></div>
        <div class="control-card">
          <h4>三键操作说明</h4>
          <p id="gHelp"></p>
        </div>
        <div class="row-btns">
          <button class="btn-pill btn-gold" id="btn-restart" type="button">重新开局</button>
        </div>
      </div>

      <div class="device-column">
        <div class="device-shell">
          <div class="device-brand">
            <span>AI PASSPORT // 240×320</span>
            <span id="gBadge">CABINET</span>
          </div>
          <div class="screen-bezel">
            <canvas id="gameCanvas" width="240" height="320"></canvas>
          </div>
          <div class="controls-panel">
            <div class="hw-btn" id="hw-btn-up">
              <div class="btn-circle" id="circle-up">◄</div>
              <span class="btn-label" id="lbl-up">UP</span>
              <span class="key-hint"><kbd>←</kbd> / <kbd>W</kbd></span>
            </div>
            <div class="hw-btn" id="hw-btn-down">
              <div class="btn-circle" id="circle-down">►</div>
              <span class="btn-label" id="lbl-down">DOWN</span>
              <span class="key-hint"><kbd>→</kbd> / <kbd>S</kbd></span>
            </div>
            <div class="hw-btn" id="hw-btn-ok">
              <div class="btn-circle" id="circle-ok">OK</div>
              <span class="btn-label" id="lbl-ok">OK</span>
              <span class="key-hint"><kbd>Space</kbd></span>
            </div>
          </div>
        </div>
        <div class="swap">
          <button class="btn-pill" id="btn-prev" type="button">◀ 上一款</button>
          <button class="btn-pill" id="btn-next" type="button">下一款 ▶</button>
        </div>
      </div>
    </div>

    <footer>
      <p>© 2026 Alex Arcade · <a href="../arcade/">大厅</a> · 25 款 AI Passport 独立游戏 在线即开即玩</p>
    </footer>
  </main>
</div>

<script src="games-engine.js"></script>
<script src="games-impl.js"></script>
<script src="games-new-impl.js"></script>
<script>
const snd = new SoundEngine();
const fx = new FXEngine();
const ids = (window.GAME_REGISTRY || []).map(g => g.id);
const NEW_IDS = ['pawssprint', 'smash', 'bubble', 'wind', 'wave', 'huddle', 'lasercat', 'splasher', 'bouncy'];

let currentTab = 'all';
let searchQuery = '';

function hsGet(id) { try { return +localStorage.getItem('aa_hs_' + id) || 0; } catch (e) { return 0; } }
function hsSet(id, v) {
  try {
    const p = hsGet(id);
    if (v > p) localStorage.setItem('aa_hs_' + id, String(v));
  } catch (e) {}
}
function remember(id) { try { localStorage.setItem('aa_last', id); } catch (e) {} }

const urlParams = new URLSearchParams(window.location.search);
let gameId = urlParams.get('id') || 'pawssprint';
if (!GAMES[gameId]) gameId = ids.includes(gameId) ? gameId : 'pawssprint';
if (!GAMES[gameId]) gameId = Object.keys(GAMES)[0];
remember(gameId);

if (localStorage.getItem('aa_mute') === '1') snd.muted = true;

function meta() { return GAME_REGISTRY.find(m => m.id === gameId) || {}; }

function paintMeta() {
  const m = meta();
  document.title = (m.title || gameId) + ' · Alex Arcade';
  document.getElementById('gIcon').textContent = m.icon || '🎮';
  document.getElementById('gTitle').textContent = m.title || gameId;
  document.getElementById('gSub').textContent = m.subtitle || '';
  document.getElementById('gDesc').textContent = m.desc || '';
  document.getElementById('gBadge').textContent = m.subtitle || gameId;
  document.getElementById('gHelp').innerHTML = m.help || '';
  document.getElementById('lbl-up').textContent = m.upHint || 'UP';
  document.getElementById('lbl-down').textContent = m.downHint || 'DOWN';
  document.getElementById('lbl-ok').textContent = m.okHint || 'OK';
  document.getElementById('gTags').innerHTML = (m.tags || []).map(t => '<span class="tag-lg">' + t + '</span>').join('');
  document.getElementById('gBest').textContent = hsGet(gameId);
  document.getElementById('btn-sound-toggle').textContent = snd.muted ? '已静音' : '音效开';
}

function selectGame(id) {
  if (!GAMES[id]) return;
  gameId = id;
  remember(gameId);
  try {
    history.replaceState(null, '', '?id=' + encodeURIComponent(gameId));
  } catch (e) {}
  paintMeta();
  renderSidebar();
  restart();
  // 移动端关闭抽屉
  document.getElementById('game-sidebar').classList.remove('open');
  document.getElementById('sidebar-mask').classList.remove('open');
}

function renderSidebar() {
  const listEl = document.getElementById('sidebar-list');
  const q = searchQuery.trim().toLowerCase();

  const matches = (g) => {
    if (currentTab === 'new' && !NEW_IDS.includes(g.id)) return false;
    if (currentTab === 'chill' && g.category !== 'chill') return false;
    if (currentTab === 'action' && !['action', 'race', 'racing'].includes(g.category)) return false;
    if (currentTab === 'shoot' && !['shoot', 'arcade', 'party'].includes(g.category)) return false;
    if (!q) return true;
    return (g.title || '').toLowerCase().includes(q) ||
           (g.subtitle || '').toLowerCase().includes(q) ||
           (g.id || '').toLowerCase().includes(q) ||
           (g.desc || '').toLowerCase().includes(q) ||
           (g.tags || []).some(t => t.toLowerCase().includes(q));
  };

  const filtered = GAME_REGISTRY.filter(matches);
  document.getElementById('sidebar-count').textContent = filtered.length + ' 款';

  if (filtered.length === 0) {
    listEl.innerHTML = '<div style="padding:24px 12px;text-align:center;color:#8a7460;font-size:12px;">未找到匹配游戏<br><small style="opacity:0.7">换个关键词试试看</small></div>';
    return;
  }

  // 若没有搜索且在“全部”Tab，分组显示；否则平铺展示
  let html = '';
  const makeItemHtml = (g) => {
    const isNew = NEW_IDS.includes(g.id);
    const short = (g.title || g.id).split('：')[0].split(':')[0];
    const isActive = g.id === gameId;
    return `
      <div class="menu-item ${isActive ? 'active' : ''}" data-id="${g.id}">
        <span class="menu-icon">${g.icon || '🎮'}</span>
        <div class="menu-info">
          <div class="menu-title-row">
            <span class="menu-title">${short}</span>
            ${isNew ? '<span class="menu-badge new">NEW</span>' : ''}
          </div>
          <span class="menu-sub">${g.subtitle || g.id}</span>
        </div>
      </div>`;
  };

  if (!q && currentTab === 'all') {
    const newGames = filtered.filter(g => NEW_IDS.includes(g.id));
    const classicGames = filtered.filter(g => !NEW_IDS.includes(g.id));

    if (newGames.length > 0) {
      html += '<div class="sidebar-group-title">✨ 2026 新品精选 (' + newGames.length + ')</div>';
      html += newGames.map(makeItemHtml).join('');
    }
    if (classicGames.length > 0) {
      html += '<div class="sidebar-group-title">🕹️ 经典街机与动作 (' + classicGames.length + ')</div>';
      html += classicGames.map(makeItemHtml).join('');
    }
  } else {
    html = filtered.map(makeItemHtml).join('');
  }

  listEl.innerHTML = html;

  // 绑定点击项
  listEl.querySelectorAll('.menu-item').forEach(el => {
    el.addEventListener('click', (e) => {
      e.preventDefault();
      const id = el.dataset.id;
      selectGame(id);
    });
  });

  // 自动让当前激活项滚动到视口内
  setTimeout(() => {
    const activeEl = listEl.querySelector('.menu-item.active');
    if (activeEl) activeEl.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
  }, 40);
}

// 侧边栏搜索与过滤事件
document.getElementById('sidebar-search').addEventListener('input', (e) => {
  searchQuery = e.target.value;
  renderSidebar();
});
document.getElementById('sidebar-tabs').addEventListener('click', (e) => {
  const btn = e.target.closest('.tab-btn');
  if (!btn) return;
  document.querySelectorAll('#sidebar-tabs .tab-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  currentTab = btn.dataset.tab;
  renderSidebar();
});

// 移动端侧边栏抽屉开关
const toggleBtn = document.getElementById('btn-toggle-sidebar');
const sidebar = document.getElementById('game-sidebar');
const mask = document.getElementById('sidebar-mask');
if (toggleBtn) {
  toggleBtn.addEventListener('click', () => {
    const isOpen = sidebar.classList.toggle('open');
    mask.classList.toggle('open', isOpen);
  });
}
if (mask) {
  mask.addEventListener('click', () => {
    sidebar.classList.remove('open');
    mask.classList.remove('open');
  });
}

paintMeta();
renderSidebar();

const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');
ctx.imageSmoothingEnabled = false;

let lastTime = performance.now();
let frameCount = 0;
const keys = { up: false, down: false, ok: false, blow: false, voice: false, upEdge: false, downEdge: false, okEdge: false, okHold: false };
const prevKeys = { up: false, down: false, ok: false };
let okHoldTicks = 0;

window.addEventListener('keydown', e => {
  // 若正在侧边栏搜索框输入，不拦截按键
  if (document.activeElement === document.getElementById('sidebar-search')) {
    if (e.code === 'Escape') document.getElementById('sidebar-search').blur();
    return;
  }

  if (['Space', 'ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', 'Enter', 'NumpadEnter'].includes(e.code)) e.preventDefault();
  snd.init();
  if (['ArrowUp', 'ArrowLeft', 'KeyW'].includes(e.code)) {
    keys.up = true; document.getElementById('circle-up').classList.add('active');
  }
  if (['ArrowDown', 'ArrowRight', 'KeyS'].includes(e.code)) {
    keys.down = true; document.getElementById('circle-down').classList.add('active');
  }
  if (['Space', 'Enter', 'NumpadEnter', 'KeyJ', 'KeyZ'].includes(e.code)) {
    if (!keys.ok) triggerOk();
    keys.ok = true; document.getElementById('circle-ok').classList.add('active');
  }
  if (e.code === 'KeyB') keys.blow = true;
  if (e.code === 'KeyV') keys.voice = true;
  if (e.code === 'KeyM') {
    snd.muted = !snd.muted;
    try { localStorage.setItem('aa_mute', snd.muted ? '1' : '0'); } catch (err) {}
    document.getElementById('btn-sound-toggle').textContent = snd.muted ? '已静音' : '音效开';
  }
  if (e.code === 'KeyP' || e.code === 'KeyR') restart();
});
window.addEventListener('keyup', e => {
  if (document.activeElement === document.getElementById('sidebar-search')) return;
  if (['ArrowUp', 'ArrowLeft', 'KeyW'].includes(e.code)) {
    keys.up = false; document.getElementById('circle-up').classList.remove('active');
  }
  if (['ArrowDown', 'ArrowRight', 'KeyS'].includes(e.code)) {
    keys.down = false; document.getElementById('circle-down').classList.remove('active');
  }
  if (['Space', 'Enter', 'NumpadEnter', 'KeyJ', 'KeyZ'].includes(e.code)) {
    keys.ok = false; document.getElementById('circle-ok').classList.remove('active');
  }
  if (e.code === 'KeyB') keys.blow = false;
  if (e.code === 'KeyV') keys.voice = false;
});

function bindBtn(id, circleId, keyName) {
  const el = document.getElementById(id);
  const circle = document.getElementById(circleId);
  const press = (e) => {
    if (e) e.preventDefault();
    document.getElementById('sidebar-search').blur();
    snd.init();
    if (keyName === 'ok' && !keys.ok) triggerOk();
    keys[keyName] = true; circle.classList.add('active');
  };
  const release = (e) => {
    if (e) e.preventDefault();
    keys[keyName] = false; circle.classList.remove('active');
  };
  el.addEventListener('mousedown', press);
  el.addEventListener('mouseup', release);
  el.addEventListener('mouseleave', release);
  el.addEventListener('touchstart', press, { passive: false });
  el.addEventListener('touchend', release, { passive: false });
}
bindBtn('hw-btn-up', 'circle-up', 'up');
bindBtn('hw-btn-down', 'circle-down', 'down');
bindBtn('hw-btn-ok', 'circle-ok', 'ok');

// 画布轻点/轻触也直接触发 OK (跳跃/动作)
const canvasEl = document.getElementById('gameCanvas');
if (canvasEl) {
  canvasEl.addEventListener('pointerdown', (e) => {
    e.preventDefault();
    document.getElementById('sidebar-search').blur();
    snd.init();
    if (!keys.ok) triggerOk();
    keys.ok = true;
    document.getElementById('circle-ok').classList.add('active');
  });
  const cancelCanvas = (e) => {
    if (keys.ok) {
      keys.ok = false;
      document.getElementById('circle-ok').classList.remove('active');
    }
  };
  canvasEl.addEventListener('pointerup', cancelCanvas);
  canvasEl.addEventListener('pointerleave', cancelCanvas);
}

function triggerOk() {
  if (GAMES[gameId] && GAMES[gameId].onOk) GAMES[gameId].onOk(snd, fx);
}
function restart() {
  if (GAMES[gameId]) {
    fx.reset();
    GAMES[gameId].init();
    if (snd && !snd.muted) snd.playClick();
  }
}
function neighbor(delta) {
  const i = Math.max(0, ids.indexOf(gameId));
  const next = ids[(i + delta + ids.length) % ids.length];
  selectGame(next);
}

document.getElementById('btn-restart').addEventListener('click', restart);
document.getElementById('btn-sound-toggle').addEventListener('click', () => {
  snd.muted = !snd.muted;
  try { localStorage.setItem('aa_mute', snd.muted ? '1' : '0'); } catch (e) {}
  document.getElementById('btn-sound-toggle').textContent = snd.muted ? '已静音' : '音效开';
});
document.getElementById('btn-share-link').addEventListener('click', () => {
  const url = window.location.href;
  navigator.clipboard.writeText(url).then(() => {
    document.getElementById('btn-share-link').textContent = '已复制';
    setTimeout(() => { document.getElementById('btn-share-link').textContent = '复制链接'; }, 1200);
  }).catch(() => prompt('复制此链接：', url));
});
document.getElementById('btn-prev').addEventListener('click', () => neighbor(-1));
document.getElementById('btn-next').addEventListener('click', () => neighbor(1));

function currentScore() {
  const g = GAMES[gameId];
  if (!g) return 0;
  if (typeof g.score === 'number') return g.score | 0;
  if (g.p && typeof g.p.score === 'number') return g.p.score | 0;
  return 0;
}

function loop(now) {
  requestAnimationFrame(loop);
  const dt = Math.min(60, now - lastTime);
  lastTime = now;
  frameCount++;

  keys.upEdge = keys.up && !prevKeys.up;
  keys.downEdge = keys.down && !prevKeys.down;
  keys.okEdge = keys.ok && !prevKeys.ok;
  if (keys.ok) {
    okHoldTicks++;
    keys.okHold = (okHoldTicks > 12);
  } else {
    okHoldTicks = 0;
    keys.okHold = false;
  }

  if (GAMES[gameId]) {
    GAMES[gameId].update(dt, keys, snd, fx);
    fx.update();
    const sc = currentScore();
    document.getElementById('gNow').textContent = sc;
    hsSet(gameId, sc);
    document.getElementById('gBest').textContent = hsGet(gameId);

    ctx.save();
    if (fx.shake > 0) {
      ctx.translate((Math.random() - 0.5) * fx.shake, (Math.random() - 0.5) * fx.shake);
    }
    GAMES[gameId].render(ctx, frameCount, fx);
    fx.render(ctx);
    ctx.restore();
  }

  prevKeys.up = keys.up;
  prevKeys.down = keys.down;
  prevKeys.ok = keys.ok;
}

window.addEventListener('DOMContentLoaded', () => {
  if (GAMES[gameId]) GAMES[gameId].init();
  requestAnimationFrame(loop);
});
</script>
</body>
