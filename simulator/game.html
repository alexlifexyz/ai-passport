<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Alex Arcade · 柜机</title>
<link rel="icon" href="../arcade/assets/coin.jpg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg-main: #100a08;
    --cyan: #7dffb3;
    --pink: #ff3d7f;
    --gold: #f0c14b;
    --text-main: #f2e2c4;
    --text-sub: #c4b49a;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--bg-main);
    color: var(--text-main);
    font-family: "IBM Plex Sans", "PingFang SC", "Hiragino Sans GB", sans-serif;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
  }
  .space-bg {
    position: fixed; inset: 0; z-index: -1;
    background:
      radial-gradient(circle at 50% 12%, #2a1612 0%, #100a08 68%),
      url("../arcade/assets/hall.jpg") center / cover;
    opacity: .28;
    filter: saturate(.6);
  }
  header {
    background: rgba(12, 8, 7, 0.9);
    backdrop-filter: blur(12px);
    border-bottom: 1px solid rgba(240, 193, 75, 0.25);
    padding: 10px 20px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 12px;
  }
  .brand-back {
    display: flex; align-items: center; gap: 8px;
    color: var(--gold); text-decoration: none;
    font-family: "Bebas Neue", Impact, sans-serif;
    letter-spacing: 0.12em; font-size: 18px;
  }
  .brand-back img { width: 22px; height: 22px; border-radius: 50%; }
  .nav-right { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .btn-pill {
    background: rgba(255,255,255,0.06);
    border: 1px solid rgba(242,226,196,0.2);
    color: var(--text-main);
    padding: 6px 12px;
    border-radius: 20px;
    font-size: 12px;
    font-weight: 700;
    text-decoration: none;
    cursor: pointer;
  }
  .btn-pill:hover { border-color: var(--gold); color: var(--gold); }
  .btn-gold { background: var(--gold); color: #1a1008; border-color: var(--gold); }

  .rail {
    display: flex; gap: 8px; overflow-x: auto;
    padding: 10px 20px 8px;
    border-bottom: 1px solid rgba(240,193,75,.15);
    scrollbar-width: thin;
  }
  .rail a {
    flex: 0 0 auto;
    text-decoration: none; color: var(--text-sub);
    font-size: 11px; font-weight: 700; letter-spacing: .08em;
    border: 1px solid rgba(242,226,196,.15);
    padding: 6px 10px; border-radius: 999px;
    white-space: nowrap;
  }
  .rail a.on, .rail a:hover {
    color: #1a1008; background: var(--gold); border-color: var(--gold);
  }

  .game-layout {
    max-width: 1100px;
    margin: 20px auto;
    padding: 0 20px 28px;
    display: grid;
    grid-template-columns: 1.05fr .95fr;
    gap: 36px;
    align-items: center;
    flex-grow: 1;
  }
  .game-details {
    background: rgba(26, 16, 14, 0.82);
    border: 1px solid #3a2a22;
    padding: 28px;
    box-shadow: 0 18px 40px rgba(0,0,0,.55);
  }
  .game-icon-large { font-size: 42px; margin-bottom: 8px; }
  .game-title-lg {
    font-family: "Bebas Neue", Impact, sans-serif;
    font-size: 40px; letter-spacing: .06em; line-height: .9;
    color: var(--gold); margin-bottom: 6px;
  }
  .game-sub-lg {
    font-size: 12px; font-weight: 700; color: var(--cyan);
    letter-spacing: .14em; margin-bottom: 14px;
  }
  .game-desc-lg {
    font-size: 14px; color: var(--text-sub); line-height: 1.7; margin-bottom: 16px;
  }
  .game-tags-lg { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 16px; }
  .tag-lg {
    border: 1px solid rgba(125,255,179,.35); color: var(--cyan);
    padding: 4px 10px; border-radius: 4px; font-size: 12px; font-weight: 700;
  }
  .score-row {
    display: flex; gap: 16px; margin-bottom: 16px;
    font-family: "Bebas Neue", Impact, sans-serif;
    letter-spacing: .12em; font-size: 18px;
  }
  .score-row span { color: var(--text-sub); font-size: 12px; letter-spacing: .16em; }
  .control-card {
    background: rgba(0,0,0,0.35);
    border: 1px dashed rgba(242,226,196,0.22);
    border-radius: 8px;
    padding: 14px;
    margin-bottom: 18px;
  }
  .control-card h4 {
    font-size: 12px; color: var(--gold); margin-bottom: 8px; letter-spacing: 0.5px;
  }
  .control-card p { font-size: 12px; color: var(--text-sub); line-height: 1.65; }
  .control-card strong { color: #fff; }
  .row-btns { display: flex; gap: 8px; flex-wrap: wrap; }

  .device-column { display: flex; flex-direction: column; align-items: center; }
  .device-shell {
    position: relative;
    width: 300px;
    background: linear-gradient(160deg, rgba(255,255,255,0.16), rgba(255,255,255,0.03));
    border: 2px solid rgba(255,255,255,0.28);
    border-radius: 22px;
    padding: 16px 14px 18px;
    box-shadow: 0 24px 60px rgba(0,0,0,0.85), inset 0 0 20px rgba(255,255,255,0.05);
    backdrop-filter: blur(16px);
    display: flex; flex-direction: column; align-items: center;
  }
  .device-brand {
    width: 100%;
    display: flex; justify-content: space-between; align-items: center;
    padding: 0 4px 8px;
    font-size: 11px; font-weight: 700; letter-spacing: 1.4px;
    color: var(--gold);
    border-bottom: 1px dashed rgba(240, 193, 75, 0.25);
    margin-bottom: 10px;
  }
  .screen-bezel {
    width: 256px; height: 336px;
    background: #050308;
    border-radius: 10px;
    padding: 8px;
    box-shadow: inset 0 0 14px rgba(0,0,0,0.95), 0 0 24px rgba(240, 193, 75, 0.12);
    border: 2px solid #2a2218;
  }
  #gameCanvas {
    width: 240px; height: 320px;
    background: #080a14;
    border-radius: 4px;
    display: block;
    image-rendering: pixelated;
  }
  .controls-panel {
    margin-top: 14px; width: 100%;
    display: flex; justify-content: space-around; align-items: center;
  }
  .hw-btn {
    display: flex; flex-direction: column; align-items: center; gap: 4px;
    cursor: pointer; user-select: none;
  }
  .btn-circle {
    width: 52px; height: 52px; border-radius: 50%;
    background: radial-gradient(circle at 30% 25%, #ff5a5a, #b11a1a 55%, #6a0d0d);
    border: 2px solid rgba(255,255,255,0.28);
    box-shadow: 0 6px 0 #3a0a0a, inset 0 2px 3px rgba(255,255,255,0.35);
    display: flex; align-items: center; justify-content: center;
    font-weight: 900; font-size: 14px; color: #fff;
  }
  .btn-circle.active, .btn-circle:active {
    transform: translateY(4px);
    box-shadow: 0 2px 0 #3a0a0a;
    filter: brightness(1.15);
  }
  #btn-ok .btn-circle {
    background: radial-gradient(circle at 30% 25%, #ffe08a, #f0c14b 55%, #8a5a10);
    color: #1a1008;
    box-shadow: 0 6px 0 #5a3a08, inset 0 2px 3px rgba(255,255,255,0.4);
  }
  #btn-ok .btn-circle.active, #btn-ok .btn-circle:active { box-shadow: 0 2px 0 #5a3a08; }
  .btn-label { font-size: 11px; font-weight: 700; color: var(--text-sub); }
  .key-hint { font-size: 9px; color: #8a7460; }
  kbd { background: #2a1c16; color: #fff; padding: 1px 4px; border-radius: 3px; font-size: 9px; border: 1px solid #5a4336; }
  .swap {
    margin-top: 12px; display: flex; gap: 8px;
  }

  footer {
    border-top: 1px solid rgba(255,255,255,0.08);
    padding: 16px 20px 24px;
    text-align: center;
    font-size: 12px;
    color: #8a7460;
  }
  footer a { color: var(--gold); }

  @media (max-width: 860px) {
    .game-layout { grid-template-columns: 1fr; }
    .game-details { order: 2; }
    .device-column { order: 1; }
  }
</style>
</head>
<body>
<div class="space-bg"></div>

<header>
  <a href="../arcade/" class="brand-back">
    <img src="../arcade/assets/coin.jpg" alt=""> ALEX ARCADE
  </a>
  <div class="nav-right">
    <button class="btn-pill" id="btn-share-link" type="button">复制链接</button>
    <a href="../arcade/" class="btn-pill btn-gold">返回大厅</a>
  </div>
</header>

<nav class="rail" id="rail"></nav>

<div class="game-layout">
  <div class="game-details">
    <div class="game-icon-large" id="gIcon">🏎️</div>
    <h1 class="game-title-lg" id="gTitle">雷霆飞车</h1>
    <div class="game-sub-lg" id="gSub">THUNDER RACER</div>
    <p class="game-desc-lg" id="gDesc"></p>
    <div class="score-row">
      <div>NOW <span id="gNow">0</span></div>
      <div>BEST <span id="gBest">0</span></div>
    </div>
    <div class="game-tags-lg" id="gTags"></div>
    <div class="control-card">
      <h4>三键操作</h4>
      <p id="gHelp"></p>
    </div>
    <div class="row-btns">
      <button class="btn-pill btn-gold" id="btn-restart" type="button">重新开局</button>
      <button class="btn-pill" id="btn-sound-toggle" type="button">音效开</button>
    </div>
  </div>

  <div class="device-column">
    <div class="device-shell">
      <div class="device-brand">
        <span>AI PASSPORT // 240×320</span>
        <span id="gBadge">CABINET</span>
      </div>
      <div class="screen-bezel">
        <canvas id="gameCanvas" width="240" height="320"></canvas>
      </div>
      <div class="controls-panel">
        <div class="hw-btn" id="hw-btn-up">
          <div class="btn-circle" id="circle-up">◄</div>
          <span class="btn-label" id="lbl-up">UP</span>
          <span class="key-hint"><kbd>←</kbd> / <kbd>W</kbd></span>
        </div>
        <div class="hw-btn" id="hw-btn-down">
          <div class="btn-circle" id="circle-down">►</div>
          <span class="btn-label" id="lbl-down">DOWN</span>
          <span class="key-hint"><kbd>→</kbd> / <kbd>S</kbd></span>
        </div>
        <div class="hw-btn" id="hw-btn-ok">
          <div class="btn-circle" id="circle-ok">OK</div>
          <span class="btn-label" id="lbl-ok">OK</span>
          <span class="key-hint"><kbd>Space</kbd></span>
        </div>
      </div>
    </div>
    <div class="swap">
      <button class="btn-pill" id="btn-prev" type="button">◀ 上一台</button>
      <button class="btn-pill" id="btn-next" type="button">下一台 ▶</button>
    </div>
  </div>
</div>

<footer>
  <p>© 2026 Alex Arcade · <a href="../arcade/">大厅</a> · 高分存在这台浏览器里</p>
</footer>

<script src="games-engine.js"></script>
<script src="games-impl.js"></script>
<script>
const snd = new SoundEngine();
const fx = new FXEngine();
const ids = (window.GAME_REGISTRY || []).map(g => g.id);

function hsGet(id) { try { return +localStorage.getItem('aa_hs_' + id) || 0; } catch (e) { return 0; } }
function hsSet(id, v) {
  try {
    const p = hsGet(id);
    if (v > p) localStorage.setItem('aa_hs_' + id, String(v));
  } catch (e) {}
}
function remember(id) { try { localStorage.setItem('aa_last', id); } catch (e) {} }

const urlParams = new URLSearchParams(window.location.search);
let gameId = urlParams.get('id') || 'thunderracer';
if (!GAMES[gameId]) gameId = ids.includes(gameId) ? gameId : 'thunderracer';
if (!GAMES[gameId]) gameId = Object.keys(GAMES)[0];
remember(gameId);

if (localStorage.getItem('aa_mute') === '1') snd.muted = true;

function meta() { return GAME_REGISTRY.find(m => m.id === gameId) || {}; }

function paintMeta() {
  const m = meta();
  document.title = (m.title || gameId) + ' · Alex Arcade';
  document.getElementById('gIcon').textContent = m.icon || '🎮';
  document.getElementById('gTitle').textContent = m.title || gameId;
  document.getElementById('gSub').textContent = m.subtitle || '';
  document.getElementById('gDesc').textContent = m.desc || '';
  document.getElementById('gBadge').textContent = m.subtitle || gameId;
  document.getElementById('gHelp').innerHTML = m.help || '';
  document.getElementById('lbl-up').textContent = m.upHint || 'UP';
  document.getElementById('lbl-down').textContent = m.downHint || 'DOWN';
  document.getElementById('lbl-ok').textContent = m.okHint || 'OK';
  document.getElementById('gTags').innerHTML = (m.tags || []).map(t => '<span class="tag-lg">' + t + '</span>').join('');
  document.getElementById('gBest').textContent = hsGet(gameId);
  document.getElementById('btn-sound-toggle').textContent = snd.muted ? '已静音' : '音效开';
  document.getElementById('rail').innerHTML = ids.map(id => {
    const g = GAME_REGISTRY.find(x => x.id === id) || { title: id };
    const short = (g.title || id).split('：')[0].split(':')[0];
    return '<a href="?id=' + encodeURIComponent(id) + '" class="' + (id === gameId ? 'on' : '') + '">' + short + '</a>';
  }).join('');
}
paintMeta();

const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');
ctx.imageSmoothingEnabled = false;

let lastTime = performance.now();
let frameCount = 0;
const keys = { up: false, down: false, ok: false, blow: false, voice: false, upEdge: false, downEdge: false, okEdge: false, okHold: false };
const prevKeys = { up: false, down: false, ok: false };
let okHoldTicks = 0;

window.addEventListener('keydown', e => {
  if (['Space', 'ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', 'Enter'].includes(e.code)) e.preventDefault();
  snd.init();
  if (['ArrowUp', 'ArrowLeft', 'KeyW'].includes(e.code)) {
    keys.up = true; document.getElementById('circle-up').classList.add('active');
  }
  if (['ArrowDown', 'ArrowRight', 'KeyS'].includes(e.code)) {
    keys.down = true; document.getElementById('circle-down').classList.add('active');
  }
  if (['Space', 'Enter'].includes(e.code)) {
    if (!keys.ok) triggerOk();
    keys.ok = true; document.getElementById('circle-ok').classList.add('active');
  }
  if (e.code === 'KeyB') keys.blow = true;
  if (e.code === 'KeyV') keys.voice = true;
  if (e.code === 'KeyM') {
    snd.muted = !snd.muted;
    try { localStorage.setItem('aa_mute', snd.muted ? '1' : '0'); } catch (err) {}
    document.getElementById('btn-sound-toggle').textContent = snd.muted ? '已静音' : '音效开';
  }
  if (e.code === 'KeyP' || e.code === 'KeyR') restart();
});
window.addEventListener('keyup', e => {
  if (['ArrowUp', 'ArrowLeft', 'KeyW'].includes(e.code)) {
    keys.up = false; document.getElementById('circle-up').classList.remove('active');
  }
  if (['ArrowDown', 'ArrowRight', 'KeyS'].includes(e.code)) {
    keys.down = false; document.getElementById('circle-down').classList.remove('active');
  }
  if (['Space', 'Enter'].includes(e.code)) {
    keys.ok = false; document.getElementById('circle-ok').classList.remove('active');
  }
  if (e.code === 'KeyB') keys.blow = false;
  if (e.code === 'KeyV') keys.voice = false;
});

function bindBtn(id, circleId, keyName) {
  const el = document.getElementById(id);
  const circle = document.getElementById(circleId);
  const press = (e) => {
    if (e) e.preventDefault();
    snd.init();
    if (keyName === 'ok' && !keys.ok) triggerOk();
    keys[keyName] = true; circle.classList.add('active');
  };
  const release = (e) => {
    if (e) e.preventDefault();
    keys[keyName] = false; circle.classList.remove('active');
  };
  el.addEventListener('mousedown', press);
  el.addEventListener('mouseup', release);
  el.addEventListener('mouseleave', release);
  el.addEventListener('touchstart', press, { passive: false });
  el.addEventListener('touchend', release, { passive: false });
}
bindBtn('hw-btn-up', 'circle-up', 'up');
bindBtn('hw-btn-down', 'circle-down', 'down');
bindBtn('hw-btn-ok', 'circle-ok', 'ok');

function triggerOk() {
  if (GAMES[gameId] && GAMES[gameId].onOk) GAMES[gameId].onOk(snd, fx);
}
function restart() {
  if (GAMES[gameId]) {
    fx.reset();
    GAMES[gameId].init();
    if (snd) snd.playClick();
  }
}
function neighbor(delta) {
  const i = Math.max(0, ids.indexOf(gameId));
  const next = ids[(i + delta + ids.length) % ids.length];
  location.href = '?id=' + encodeURIComponent(next);
}

document.getElementById('btn-restart').addEventListener('click', restart);
document.getElementById('btn-sound-toggle').addEventListener('click', () => {
  snd.muted = !snd.muted;
  try { localStorage.setItem('aa_mute', snd.muted ? '1' : '0'); } catch (e) {}
  document.getElementById('btn-sound-toggle').textContent = snd.muted ? '已静音' : '音效开';
});
document.getElementById('btn-share-link').addEventListener('click', () => {
  const url = window.location.href;
  navigator.clipboard.writeText(url).then(() => {
    document.getElementById('btn-share-link').textContent = '已复制';
    setTimeout(() => { document.getElementById('btn-share-link').textContent = '复制链接'; }, 1200);
  }).catch(() => prompt('复制此链接：', url));
});
document.getElementById('btn-prev').addEventListener('click', () => neighbor(-1));
document.getElementById('btn-next').addEventListener('click', () => neighbor(1));

function currentScore() {
  const g = GAMES[gameId];
  if (!g) return 0;
  if (typeof g.score === 'number') return g.score | 0;
  if (g.p && typeof g.p.score === 'number') return g.p.score | 0;
  return 0;
}

function loop(now) {
  requestAnimationFrame(loop);
  const dt = Math.min(60, now - lastTime);
  lastTime = now;
  frameCount++;

  keys.upEdge = keys.up && !prevKeys.up;
  keys.downEdge = keys.down && !prevKeys.down;
  keys.okEdge = keys.ok && !prevKeys.ok;
  if (keys.ok) {
    okHoldTicks++;
    keys.okHold = (okHoldTicks > 12);
  } else {
    okHoldTicks = 0;
    keys.okHold = false;
  }

  if (GAMES[gameId]) {
    GAMES[gameId].update(dt, keys, snd, fx);
    fx.update();
    const sc = currentScore();
    document.getElementById('gNow').textContent = sc;
    hsSet(gameId, sc);
    document.getElementById('gBest').textContent = hsGet(gameId);

    ctx.save();
    if (fx.shake > 0) {
      ctx.translate((Math.random() - 0.5) * fx.shake, (Math.random() - 0.5) * fx.shake);
    }
    GAMES[gameId].render(ctx, frameCount, fx);
    fx.render(ctx);
    ctx.restore();
  }

  prevKeys.up = keys.up;
  prevKeys.down = keys.down;
  prevKeys.ok = keys.ok;
}

window.addEventListener('DOMContentLoaded', () => {
  if (GAMES[gameId]) GAMES[gameId].init();
  requestAnimationFrame(loop);
});
</script>
</body>
</html>
